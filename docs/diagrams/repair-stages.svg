-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="alphabetic" xml:space="preserve">(nextStages table) throws InvalidOperationException</text><text x="872" y="535" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1d2730" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="alphabetic" xml:space="preserve">and nothing changes.</text><polygon points="0,0 246,0 258,12 258,46 0,46" fill="#fffbe8" stroke="#55626e" stroke-width="1.1"></polygon><polyline points="246,0 246,12 258,12" fill="none" stroke="#55626e" stroke-width="1.1"></polyline><text x="12" y="21" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1d2730" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="alphabetic" xml:space="preserve">IsLate(today): stage before ReadyForPickup</text><text x="12" y="37" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#1d2730" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="alphabetic" xml:space="preserve">and today &gt; PromisedOn.</text></g><g class="labels"></g></svg>
